<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0c0a1e">
<link rel="icon" href="data:,">
<title>ร้านทดลอง</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3fb;--card:#fff;--tx:#14122b;--mut:#6e6b8f;--bd:#e5e3f3;--pr:#8b5cf6;--pr2:#5b8def;--warm:#ff7a59;--good:#12915f;--bad:#e5484d;--wbg:#fff3d1;--wtx:#7a4a06;--r:20px;--sh:0 1px 2px rgba(20,18,43,.04),0 10px 26px -14px rgba(20,18,43,.22);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@supports (color:color-mix(in srgb,red,blue)){:root{--pr2:color-mix(in srgb,var(--pr) 62%,#4f8cff)}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0a1e;--card:#15122b;--tx:#efeefb;--mut:#9a97c0;--bd:#2a2650;--good:#3ddc97;--wbg:#3a2d0c;--wtx:#f6d58a;--sh:0 1px 2px rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{--bg:#0c0a1e;--card:#15122b;--tx:#efeefb;--mut:#9a97c0;--bd:#2a2650;--good:#3ddc97;--wbg:#3a2d0c;--wtx:#f6d58a;--sh:0 1px 2px rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.7)}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:15px/1.55 "Prompt",system-ui,-apple-system,"Noto Sans Thai","Sarabun",sans-serif;padding-bottom:112px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60% 38% at 92% 0%,color-mix(in srgb,var(--pr) 24%,transparent),transparent),radial-gradient(50% 32% at 0% 34%,color-mix(in srgb,var(--pr2) 16%,transparent),transparent)}
#capt,#capb{position:fixed;left:0;right:0;z-index:40;background:var(--bg);pointer-events:none}
#capt{top:0;height:env(safe-area-inset-top,0px)}#capb{bottom:0;height:env(safe-area-inset-bottom,0px)}
#bgi{position:fixed;top:-120px;bottom:-120px;left:0;right:0;z-index:-2;background-size:cover;background-position:center}
#bgi::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:var(--dim,.78)}
@keyframes spin{to{transform:rotate(360deg)}}
.ld{display:grid;place-items:center;height:70vh}.ld span{width:34px;height:34px;border-radius:50%;border:3px solid var(--bd);border-top-color:var(--pr);animation:spin .8s linear infinite}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
@supports (backdrop-filter:blur(1px)) and (color:color-mix(in srgb,red,blue)){header{background:color-mix(in srgb,var(--card) 78%,transparent);backdrop-filter:saturate(1.5) blur(16px);-webkit-backdrop-filter:saturate(1.5) blur(16px)}}
.logo{display:flex;align-items:center;gap:10px;min-width:0;font-size:17px;font-weight:600;user-select:none;-webkit-user-select:none;cursor:pointer}
.logo>span:last-child,.logo{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mark{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;background:linear-gradient(135deg,var(--pr),var(--pr2))}
.lg{flex:none;height:40px;width:40px;object-fit:cover;border-radius:13px;box-shadow:0 0 0 1px var(--bd)}
.bal{flex:none;font-weight:600;font-variant-numeric:tabular-nums;padding:7px 14px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);cursor:pointer;transition:color .3s,border-color .3s}
.bal.bump{color:var(--good);border-color:var(--good)}
.tick{overflow:hidden;white-space:nowrap;background:linear-gradient(90deg,var(--pr),var(--pr2));color:#fff;font-size:13px;padding:6px 0}
.tk{display:inline-flex;animation:marq 30s linear infinite}.tk span{padding:0 36px}
@keyframes marq{to{transform:translateX(-50%)}}
main{padding:14px 16px;max-width:760px;margin:0 auto}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes drift{to{transform:translate(-40px,30px) scale(1.15)}}
@keyframes sheen{0%,55%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes lift{from{transform:scale(.8)}to{transform:translateY(-2px)}}
@keyframes fade{from{opacity:0}}
@keyframes sheet{from{transform:translateY(100%)}}
@keyframes toast{from{opacity:0;transform:translate(-50%,16px) scale(.9)}}
#app.go main>*:not(.grid){animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
#app.go main>*:nth-child(2){animation-delay:.05s}#app.go main>*:nth-child(3){animation-delay:.1s}#app.go main>*:nth-child(n+4){animation-delay:.15s}
#app.go .grid>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*60ms + 120ms)}
#app.go nav button.on i{animation:lift .45s cubic-bezier(.3,1.6,.5,1) both}
.hero{position:relative;overflow:hidden;isolation:isolate;border-radius:28px;padding:26px 22px 26px;color:#fff;background:linear-gradient(135deg,var(--pr),var(--pr2));display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(28px);z-index:-1;animation:drift 12s ease-in-out infinite alternate}
.hero::before{width:230px;height:230px;background:rgba(255,255,255,.3);top:-80px;right:-50px}
.hero::after{width:190px;height:190px;background:rgba(255,255,255,.18);bottom:-80px;left:-30px;animation-duration:16s;animation-direction:alternate-reverse}
.hero .big{width:88px;height:88px;border-radius:26px;object-fit:cover;font-size:38px;box-shadow:0 16px 36px -12px rgba(0,0,0,.55),0 0 0 4px rgba(255,255,255,.28);background:rgba(255,255,255,.2)}
.hero h1{margin:10px 0 0;font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.hero p{margin:2px 0 0;opacity:.94;max-width:92%}
.btn.light{width:auto;display:inline-block;padding:11px 24px;margin-top:12px;background:#fff;color:#1b1540;box-shadow:none;border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.st{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 4px;text-align:center;box-shadow:var(--sh)}
.st b{display:block;font-size:18px;font-variant-numeric:tabular-nums}.st span{font-size:11px;color:var(--mut)}
.ql{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ql button{padding:12px 6px;border-radius:16px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:13px;font-weight:500;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--sh);transition:transform .15s}
.ql button:active{transform:scale(.95)}.ql svg{color:var(--pr)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.sec h2{margin:0;display:flex;align-items:center;gap:8px}.sec h2::before{content:"";width:4px;height:18px;border-radius:4px;background:linear-gradient(var(--pr),var(--pr2))}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar,.bn::-webkit-scrollbar,.rc::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 18px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:14px;cursor:pointer;transition:transform .15s,background .25s,color .25s}
.chip:active{transform:scale(.94)}.chip.on{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-color:transparent}
.bn{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:28px;box-shadow:var(--sh)}
.bs{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:16/8;background-size:cover;background-position:center;position:relative}
.bs[data-a]{cursor:pointer}
.bs::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(5,8,20,.7))}
.bt{position:absolute;left:18px;right:18px;bottom:16px;z-index:1;color:#fff;display:flex;flex-direction:column;gap:2px}
.bt b{font-size:22px;line-height:1.2;text-shadow:0 2px 12px rgba(0,0,0,.45)}.bt span{opacity:.92;font-size:14px}
.dots{display:flex;justify-content:center;gap:6px;margin:10px 0 2px}
.dots i{width:7px;height:7px;border-radius:99px;background:var(--bd);transition:width .3s,background .3s}.dots i.on{width:22px;background:var(--pr)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px;box-shadow:var(--sh)}
.pc{display:flex;flex-direction:column;gap:2px;transition:transform .25s cubic-bezier(.2,.7,.2,1),border-color .25s}
.pc:active{transform:scale(.98)}
@media(hover:hover){.pc:hover{transform:translateY(-4px);border-color:var(--pr)}.pc:hover .pw img{transform:scale(1.07)}}
.pw{position:relative;overflow:hidden;border-radius:14px;cursor:pointer;margin-bottom:8px}
.pw img{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.pw.big{max-width:420px;margin:0 auto 4px}
.pic{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--bg)}
.em{aspect-ratio:1/1;display:grid;place-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--pr) 22%,var(--bg)),color-mix(in srgb,var(--pr2) 22%,var(--bg)))}
.em img{width:46%;opacity:.7;border-radius:18%}.em span{font-size:54px;font-weight:700;color:color-mix(in srgb,var(--pr) 70%,var(--tx))}
.tag{position:absolute;top:8px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;color:#fff}
.tag.hot{left:8px;background:var(--warm)}.tag.fast{right:8px;background:rgba(10,8,30,.72)}
.nm{font-weight:600;line-height:1.3;cursor:pointer}
.pz{font-size:18px;font-weight:700}.pz s{color:var(--mut);font-size:13px;font-weight:400;margin-left:6px}
.mut{color:var(--mut);font-size:13px}
.btn{position:relative;overflow:hidden;display:block;width:100%;margin-top:8px;padding:12px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;font:inherit;font-weight:600;cursor:pointer;box-shadow:0 10px 22px -12px var(--pr);transition:transform .15s,filter .2s;text-align:center}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%)}
@media(hover:hover){.btn:hover{filter:brightness(1.07)}.btn:hover::after{transform:translateX(120%);transition:transform .7s}}
.btn:active{transform:scale(.96)}.btn:disabled{opacity:.4;box-shadow:none}
.btn.alt{background:transparent;color:var(--tx);border:1px solid var(--bd);box-shadow:none}.btn.alt::after,.btn.light::after{display:none}
.btn.red{background:var(--bad);box-shadow:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.qty{display:flex;align-items:center;gap:10px;font-weight:600}
.qty button{width:32px;height:32px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;cursor:pointer;transition:transform .15s}.qty button:active{transform:scale(.85)}
h2{margin:6px 0 10px;font-size:19px;font-weight:600}h3{margin:0 0 8px;font-weight:600}
input,select,textarea{width:100%;padding:12px;margin:4px 0;border-radius:14px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
input[type=color]{padding:2px;height:46px}input[type=range]{padding:0;height:28px}
.feat{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--bd)}.feat:last-child{border:0}
.fi{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--pr),var(--pr2))}
.rc{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 8px}
.rc>div{flex:none;min-width:210px;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh)}
.rk{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}.rk:last-child{border:0}
.rk i{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-weight:700;color:#fff}
.rk .r1{background:#f0b429}.rk .r2{background:#9aa6b8}.rk .r3{background:#c98a52}
.chipx{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px}.chipx.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}.chipx.wait{background:var(--wbg);color:var(--wtx)}.chipx.no{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.qr{display:block;width:100%;max-width:260px;margin:10px auto;border-radius:14px;background:#fff;padding:8px}
.foot{margin:28px 0 8px;text-align:center;color:var(--mut);font-size:13px}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.pills a{padding:8px 16px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);text-decoration:none;font-size:13px}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;display:flex;padding:6px;border-radius:26px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh),0 16px 32px -14px rgba(0,0,0,.4);z-index:6}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border:0;background:none;color:var(--mut);font:inherit;font-size:11px;cursor:pointer}
nav i{position:relative;display:grid;place-items:center;width:48px;height:30px;border-radius:15px;transition:background .25s,color .25s,transform .3s cubic-bezier(.3,1.6,.5,1)}
nav button.on{color:var(--tx);font-weight:600}nav button.on i{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;transform:translateY(-2px)}
nav button:active i{transform:scale(.88)}
nav em{position:absolute;top:-5px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--warm);color:#fff;font:600 11px/18px "Prompt",system-ui;font-style:normal;text-align:center}
em.pop{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
.fab{position:fixed;right:14px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:7;height:46px;padding:0 16px;border-radius:99px;border:0;color:#fff;background:linear-gradient(135deg,var(--pr),var(--pr2));display:flex;align-items:center;gap:8px;font:inherit;font-weight:600;font-size:14px;box-shadow:0 12px 28px -10px var(--pr);cursor:pointer;transition:transform .15s}.fab:active{transform:scale(.94)}
.wcard{position:relative;overflow:hidden;isolation:isolate;border-radius:26px;padding:22px 20px;color:#fff;background:linear-gradient(135deg,var(--pr),var(--pr2));box-shadow:0 20px 40px -20px var(--pr)}
.wcard::after{content:"";position:absolute;inset:-40% -60%;z-index:-1;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.3) 50%,transparent 58%);animation:sheen 5s ease-in-out infinite}
.wcard .wm{position:absolute;right:16px;top:16px;width:52px;height:52px;border-radius:16px;object-fit:cover;opacity:.9;box-shadow:0 0 0 3px rgba(255,255,255,.3)}
.wcard .lbl{opacity:.85;font-size:13px}.wcard .amt{font-size:34px;font-weight:700;margin:2px 0 6px;font-variant-numeric:tabular-nums}
.wcard .cid{margin-top:16px;font:500 15px ui-monospace,Menlo,monospace;letter-spacing:2px;opacity:.92}
.idbox{font:600 20px/1.2 ui-monospace,Menlo,monospace;letter-spacing:2px;text-align:center;padding:14px;background:var(--bg);border:1px dashed var(--bd);border-radius:14px;margin:8px 0}
.cr{color:var(--good)}.dr{color:var(--bad)}
#dlg,#adm{position:fixed;inset:0;z-index:20}
#dlg{background:rgba(6,5,20,.58);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;animation:sheet .38s cubic-bezier(.2,.9,.3,1)}
#adm{background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);animation:fade .25s}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{flex:none;padding:8px 16px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.tabs button.on{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-color:transparent}
.thumb{width:48px;height:48px;object-fit:cover;border-radius:10px;flex:none}.thumb.ph{display:grid;place-items:center;background:var(--bg);font-weight:700;color:var(--pr)}
.warn{background:var(--wbg);color:var(--wtx);border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.step{display:flex;align-items:center;gap:8px;margin:6px 0}
.step button{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:20px;cursor:pointer}.step input{width:84px;text-align:center;margin:0}
.slots{counter-reset:s;display:flex;flex-direction:column;gap:6px;margin:8px 0}
.slotrow{counter-increment:s;display:flex;align-items:center;gap:6px;animation:rise .3s both}
.slotrow::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:9px;background:var(--bg);color:var(--mut);display:grid;place-items:center;font-size:12px}
.slotrow input{margin:0}.slotrow .x{flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--bad);font-size:18px;cursor:pointer}
.bimg{width:100%;aspect-ratio:16/6;object-fit:cover;border-radius:12px;margin:6px 0;display:block}
.btns{display:flex;gap:6px;flex-wrap:wrap}.btns .btn{width:auto;flex:1;min-width:70px}
.sw2{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}.swt{width:36px;height:36px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--bd);cursor:pointer;transition:transform .15s}.swt:active{transform:scale(.88)}
#toast{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:50;font-size:14px;max-width:90%;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);animation:toast .4s cubic-bezier(.2,1.4,.4,1)}

/* ---- design pass 2 ---- */
.hr{display:flex;align-items:center;gap:8px;flex:none}
.chatb{width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);color:var(--pr);display:grid;place-items:center;cursor:pointer;transition:transform .15s}.chatb:active{transform:scale(.9)}
.hero::before{background:color-mix(in srgb,var(--pr2) 55%,#fff);opacity:.26}
.pw.big::after{display:none}.pw.big .pic,.pw.big .em{aspect-ratio:4/3}
input[type=file]{padding:8px;color:var(--mut)}
input[type=file]::file-selector-button{margin-right:12px;padding:8px 14px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;font:inherit;font-weight:600;cursor:pointer}
body{font-size:14.5px}
@keyframes aur{to{transform:translate(32vmax,-12vh) scale(1.2)}}
body::after{content:"";position:fixed;z-index:-1;width:70vmax;height:70vmax;left:-28vmax;top:38vh;pointer-events:none;background:radial-gradient(circle,color-mix(in srgb,var(--pr2) 17%,transparent),transparent 62%);animation:aur 20s ease-in-out infinite alternate}
.card{background:color-mix(in srgb,var(--card) 90%,transparent);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.05)}
header{padding:8px 14px}
@supports (backdrop-filter:blur(1px)) and (color:color-mix(in srgb,red,blue)){nav{background:color-mix(in srgb,var(--card) 84%,transparent);backdrop-filter:saturate(1.5) blur(18px);-webkit-backdrop-filter:saturate(1.5) blur(18px)}}

<script>
const KEY='shop_demo_v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const baht=s=>'฿'+(s/100).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2));
const dt=t=>new Date(t).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'});
function code12(){let s='';while(s.length<12){const b=new Uint8Array(16);crypto.getRandomValues(b);for(const x of b){if(x<250&&s.length<12)s+=x%10}}return s}
const okImg=s=>typeof s==='string'&&/^data:image\/(jpeg|png|svg\+xml)[;,]/.test(s)&&s.length<900000&&!/["')\s]/.test(s);
const svgUri=x=>'data:image/svg+xml;utf8,'+encodeURIComponent(x).replace(/\(/g,'%28').replace(/\)/g,'%29').replace(/'/g,'%27');
const art=(c1,c2)=>svgUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="200" height="200" fill="url(#g)"/><polygon points="100,34 166,100 100,166 34,100" fill="#fff" fill-opacity=".22"/><circle cx="100" cy="100" r="30" fill="#fff" fill-opacity=".35"/></svg>`);
const ban=(c1,c2)=>svgUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="800" height="400" fill="url(#g)"/><circle cx="650" cy="110" r="190" fill="#fff" fill-opacity=".13"/><circle cx="110" cy="390" r="140" fill="#fff" fill-opacity=".1"/><polygon points="560,330 640,200 720,330" fill="#fff" fill-opacity=".16"/></svg>`);
const DEFCATS=()=>[{id:'c-game',name:'ไอเทมดิจิทัล'},{id:'c-gen',name:'สินค้าทั่วไป'}];
const parseCodes=t=>[...new Set((Array.isArray(t)?t:String(t).split('\n')).map(x=>String(x).trim().slice(0,200)).filter(Boolean))].slice(0,2000);
const mkc=n=>Array.from({length:n},()=>{const a=code12();return 'DEMO-'+a.slice(0,4)+'-'+a.slice(4,8)+'-'+a.slice(8)});
const SAMPLES=()=>[
 {id:uid(),name:'ตัวอย่างสินค้า A',price:12900,sale:9900,stock:20,on:true,img:art('#8b5cf6','#4f8cff'),desc:'สินค้าตัวอย่างสำหรับทดสอบระบบ'},
 {id:uid(),name:'ตัวอย่างสินค้า B',price:5900,sale:null,stock:50,on:true,img:art('#ec4899','#8b5cf6'),desc:'สินค้าตัวอย่างสำหรับทดสอบระบบ'},
 {id:uid(),name:'ตัวอย่างไอเทมส่งอัตโนมัติ',price:9900,sale:null,stock:5,on:true,digital:true,codes:mkc(5),img:art('#06b6d4','#6d5efc'),desc:'ข้อมูลตัวอย่างสำหรับทดสอบระบบ ชำระแล้วได้รับรหัสทันที'},
 {id:uid(),name:'ตัวอย่างไอเทมแอดมินส่งมอบ',price:19900,sale:14900,stock:3,on:true,digital:true,codes:[],img:art('#f97316','#ec4899'),desc:'ข้อมูลตัวอย่างสำหรับทดสอบระบบ แอดมินส่งมอบให้หลังชำระ'}];
const pic=p=>okImg(p.img)?`<img class="pic" src="${p.img}" alt="${esc(p.name)}" loading="lazy">`:`<div class="em">${okImg(S.settings.logo)?`<img src="${S.settings.logo}" alt="">`:`<span>${esc([...p.name][0]||'')}</span>`}</div>`;
function shrink(file,max=640,q=.8,type='image/jpeg'){return new Promise((res,rej)=>{if(!file||!/^image\//.test(file.type))return rej(new Error('ไฟล์ต้องเป็นรูปภาพ'));const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL(type,q))};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('เปิดรูปไม่ได้'))};im.src=u})}
const seed=()=>({v:1,customers:{},me:null,carts:{},orders:[],admin:null,cats:DEFCATS(),banners:[],topups:[],refs:[],
 settings:{name:'ร้านทดลอง',tag:'ไอเทมเกมและของใช้ ชำระแล้วรับรหัสทันที',color:'#6d5efc',bg:''},
 products:SAMPLES().map(x=>({...x,catId:x.digital?'c-game':'c-gen'}))});
const KEY2='shop_demo_v2',AAD=new TextEncoder().encode('shop-v2');
let persist=true,locked=false,cryptoOn=false,aesKey=null,saveQ=Promise.resolve();
const b64=buf=>{const u=new Uint8Array(buf);let t='';for(let i=0;i<u.length;i+=32768)t+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(t)};
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('shopkeys',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function getKey(){const nk=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);const db=await idb();try{return await new Promise((res,rej)=>{const tx=db.transaction('k','readwrite'),st=tx.objectStore('k'),g=st.get('main');g.onsuccess=()=>{if(g.result)res(g.result);else{st.put(nk,'main');tx.oncomplete=()=>res(nk)}};g.onerror=()=>rej(g.error);tx.onerror=()=>rej(tx.error)})}finally{db.close()}}
async function encState(key,str){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:AAD},key,new TextEncoder().encode(str));return JSON.stringify({v:2,iv:b64(iv),ct:b64(ct)})}
async function decState(key,txt){const o=JSON.parse(txt);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv),additionalData:AAD},key,unb64(o.ct));return new TextDecoder().decode(pt)}
function save(){if(locked)return;const snap=JSON.stringify(S);saveQ=saveQ.then(async()=>{try{if(cryptoOn)localStorage.setItem(KEY2,await encState(aesKey,snap));else localStorage.setItem(KEY,snap)}catch(e){persist=false}})}
function audit(c){let b=0;for(const x of [...c.ledger].reverse()){if(x.before!==b)return false;const a=x.dir==='CR'?b+x.amount:b-x.amount;if(x.after!==a||a<0)return false;b=a}return b===c.balance}
function normalize(){S.cats=S.cats||DEFCATS();S.banners=S.banners||[];S.carts=S.carts||{};S.orders=S.orders||[];S.products=S.products||[];S.customers=S.customers||{};S.topups=S.topups||[];S.refs=S.refs||[];
 S.settings=Object.assign({name:'ร้านทดลอง',tag:'ไอเทมเกมและของใช้ ชำระแล้วรับสินค้าทันที',color:'#8b5cf6',color2:'',mode:'auto',logo:'',bgImg:'',dim:78,notice:'',
  feat:[{t:'ส่งมอบรวดเร็ว',d:'ชำระด้วย Wallet แล้วรับสินค้าทันที หรือรอแอดมินส่งมอบตามประเภทสินค้า'},{t:'ใช้งานง่าย',d:'ไม่ต้องสมัครสมาชิก ระบบสร้างรหัสบัญชีให้อัตโนมัติ'},{t:'ติดต่อแอดมิน',d:'มีปัญหาหรือคำถาม ติดต่อแอดมินได้ผ่านช่องทางของร้าน'}],
  guide:'1. คัดลอกรหัสบัญชีจากหน้า Wallet\n2. เติมเงินตามวิธีที่ร้านกำหนด แล้วแนบสลิปส่งคำขอ\n3. เลือกสินค้า เพิ่มลงตะกร้า แล้วชำระด้วย Wallet\n4. รับรหัสทันที หรือรอแอดมินส่งมอบ ดูได้ที่หน้า "บัญชี"',
  pay:'',qr:'',links:[]},S.settings||{});
 if(!S.settings.linksSeeded&&!(S.settings.links||[]).length){S.settings.links=[{id:'discord',label:'Discord',url:'https://discord.gg/9CnQ4wSW'}];S.settings.linksSeeded=true}
 S.products.forEach(p=>{if(p.catId===undefined)p.catId=p.digital?'c-game':'c-gen';if(p.digital&&!p.codes)p.codes=[]})}
async function boot(){
  try{aesKey=await getKey();cryptoOn=true}catch(e){cryptoOn=false}
  let raw=null,legacy=null;
  try{raw=localStorage.getItem(KEY2);legacy=localStorage.getItem(KEY)}catch(e){persist=false}
  try{
    if(raw){if(!cryptoOn)throw new Error('no key');S=JSON.parse(await decState(aesKey,raw))}
    else if(legacy){const o=JSON.parse(legacy);if(o&&o.v===1)S=o}
  }catch(e){locked=true;render();return}
  normalize();me();save();
  if(cryptoOn&&legacy){await saveQ;try{localStorage.removeItem(KEY)}catch(e){}}
  render();
}
let catF='',bnT=null,lastAct=Date.now(),lastN=0,lastKey='',lastBal=null,curP=null,S=seed(),view='home',adminOk=false,tab='topup',taps=[],pending=null;
function me(){if(!S.me||!S.customers[S.me]){let id;do{id=code12()}while(S.customers[id]);S.customers[id]={id,created:Date.now(),balance:0,ledger:[]};S.me=id;save()}return S.customers[S.me]}
const cartOf=()=>S.carts[S.me]||(S.carts[S.me]={});
const prod=id=>S.products.find(p=>p.id===id);

 if(s.mode==='dark'||s.mode==='light')r.dataset.theme=s.mode;else delete r.dataset.theme;
 document.title=s.name;const g=$('#bgi');if(g){if(okImg(s.bgImg)){g.style.backgroundImage="url('"+s.bgImg+"')";g.hidden=false;r.style.setProperty('--dim',String((s.dim||78)/100))}else{g.hidden=true;g.style.backgroundImage=''}}
 const fl=document.querySelector('link[rel=icon]');if(fl&&okImg(s.logo))fl.href=s.logo;

    if(!/^\d{12}$/.test(cid))return toast('รหัสต้องเป็นตัวเลข 12 หลัก');if(!c)return toast('ไม่พบรหัสนี้ในเครื่องนี้');if(!audit(c))return toast('ตรวจพบความผิดปกติของยอดเงินบัญชีนี้ ระงับการทำรายการ');
    if(!(amt>0)||amt>100000000)return toast('จำนวนเงินไม่ถูกต้อง');if(!ref)return toast('ต้องกรอกเลขอ้างอิง');if(refUsed(ref))return toast('เลขอ้างอิงนี้ถูกใช้ไปแล้ว');
    pending=uid();dlg(`<h3>ยืนยันการเติมเงิน</h3><div class="row"><span>ลูกค้า</span><b>${cid}</b></div><div class="row"><span>ยอดปัจจุบัน</span><b>${baht(c.balance)}</b></div><div class="row"><span>เติม</span><b class="cr">+${baht(amt)}</b></div><div class="row"><span>อ้างอิง</span><b>${esc(ref)}</b></div><button class="btn" data-a="tpdo" data-id="${cid}" data-amt="${amt}" data-ref="${esc(ref)}">ยืนยันเติมเงิน</button><button class="btn alt" data-a="close">ยกเลิก</button>`)}
  else if(a==='tpdo'){if(!pending)return;pending=null;closeDlg();const c=S.customers[id],ref=t.dataset.ref;if(refUsed(ref))return toast('เลขอ้างอิงนี้ถูกใช้ไปแล้ว');post(c,'TOPUP_CREDIT','CR',parseInt(t.dataset.amt,10),{ref,reason:ref,actor:'admin'});S.refs.push(ref.toLowerCase());done('เติมเงินเรียบร้อย')}
  else if(a==='tpapp'){const r=S.topups.find(x=>x.id===id);if(!r||r.status!=='PENDING')return;pending=uid();dlg(`<h3>อนุมัติเติมเงิน</h3><div class="row"><span>ลูกค้า</span><b>${r.cid}</b></div><div class="row"><span>จำนวน</span><b class="cr">+${baht(r.amt)}</b></div><p class="mut">ตรวจยอดและเลขอ้างอิงจากบัญชีธนาคารของคุณก่อนอนุมัติ</p><input id="tpr" placeholder="เลขอ้างอิงจากธนาคาร (จำเป็น ห้ามซ้ำ)"><button class="btn" data-a="tpappdo" data-id="${id}">ยืนยันอนุมัติ</button><button class="btn alt" data-a="close">ยกเลิก</button>`)}
  else if(a==='tpappdo'){const r=S.topups.find(x=>x.id===id),ref=v('tpr').trim();if(!pending||!r||r.status!=='PENDING')return;if(!ref)return toast('ใส่เลขอ้างอิง');if(refUsed(ref))return toast('เลขอ้างอิงนี้ถูกใช้ไปแล้ว');const c=S.customers[r.cid];if(!c||!audit(c))return toast('ไม่พบบัญชี หรือยอดเงินผิดปกติ');pending=null;closeDlg();post(c,'TOPUP_CREDIT','CR',r.amt,{ref,reason:'อนุมัติ '+r.id,actor:'admin'});S.refs.push(ref.toLowerCase());r.status='APPROVED';r.ref=ref;done('อนุมัติและเติมเงินแล้ว')}
  else if(a==='tprej'){const r=S.topups.find(x=>x.id===id);if(r&&r.status==='PENDING'){r.status='REJECTED';done('ไม่อนุมัติคำขอแล้ว')}}
  else if(a==='deliver'){const o=S.orders.find(x=>x.id===id),k=+t.dataset.k,i=o&&o.items[k];if(!i||!(i.pend>0))return;(i.manual=i.manual||[]).push(v('dl-'+id+'-'+k).trim().slice(0,300)||'ส่งมอบผ่านช่องทางติดต่อแล้ว');i.pend--;done('ส่งมอบแล้ว')}
  else if(a==='addslot'){const bx=$('#'+id);bx.insertAdjacentHTML('beforeend',slotRow(''));cnt(bx.closest('.sw'));if(id==='npbox')$('#npcount').value=bx.children.length;bx.lastElementChild.querySelector('input').focus()}
  else if(a==='rmslot'){const bx=t.closest('.slots');t.parentElement.remove();cnt(bx.closest('.sw'));if(bx.id==='npbox')$('#npcount').value=bx.children.length}
  else if(a==='slotplus'){const bx=$('#npbox');setSlots(bx.children.length+1)}
  else if(a==='slotminus'){const bx=$('#npbox');setSlots(bx.children.length-1)}
  else if(a==='addprod'){const n=v('npn').trim(),p=baht2sat(v('npp')),dg=v('npt')!=='p',codes=dg?parseCodes(slotVals('#npbox')):[],stk=parseInt(v('nps'),10);
    if(!n||!(p>0)||(!(stk>=0)&&!codes.length))return toast('กรอกชื่อ ราคา และสต็อกให้ถูกต้อง');const k=Math.max(stk>=0?stk:0,codes.length);
    let img=null;const f=$('#npi')&&$('#npi').files[0];if(f){try{img=await shrink(f)}catch(er){return toast(er.message)}}
    S.products.unshift({id:uid(),name:n.slice(0,60),price:p,sale:null,stock:k,on:true,img,digital:dg,codes,desc:v('npd').trim().slice(0,1000),catId:v('npcat')});done('เพิ่มสินค้าแล้ว')}
  else if(a==='saveprod'){const p=prod(id),pz=baht2sat(v('pp-'+id)),sv=v('ps-'+id).trim(),sl=sv?baht2sat(sv):null,k=parseInt(v('pk-'+id),10);
    if(!(pz>0)||!(k>=0)||(sv&&!(sl>=0&&sl<pz)))return toast('ตรวจราคา/ราคาลด/สต็อกอีกครั้ง');
    const f=$('#pi-'+id)&&$('#pi-'+id).files[0];if(f){try{p.img=await shrink(f)}catch(er){return toast(er.message)}}
    p.desc=v('pd-'+id).trim().slice(0,1000);p.catId=v('pcat-'+id);p.price=pz;p.sale=sl;p.stock=k;
    if(p.digital)p.codes=parseCodes(slotVals('#sl-'+id));
    done('บันทึกแล้ว')}
  else if(a==='rmimg'){const p=prod(id);delete p.img;done()}
  else if(a==='samples'){SAMPLES().forEach(x=>{x.catId=x.digital?'c-game':'c-gen';S.products.push(x)});done('เพิ่มสินค้าตัวอย่างแล้ว')}
  else if(a==='togprod'){const p=prod(id);p.on=!p.on;done()}
  else if(a==='delprod'){S.products=S.products.filter(p=>p.id!==id);done()}
  else if(a==='addcat'){const n=v('cn').trim();if(!n)return toast('ใส่ชื่อหมวด');S.cats.push({id:uid(),name:n.slice(0,30)});done('เพิ่มหมวดแล้ว')}
  else if(a==='savecat'){const c=S.cats.find(x=>x.id===id),n=v('cn-'+id).trim();if(!c||!n)return toast('ใส่ชื่อหมวด');c.name=n.slice(0,30);done('บันทึกแล้ว')}
  else if(a==='delcat'){S.cats=S.cats.filter(x=>x.id!==id);S.products.forEach(p=>{if(p.catId===id)p.catId=''});if(catF===id)catF='';done()}
  else if(a==='addban'){const f=$('#bf')&&$('#bf').files[0];if(!f)return toast('เลือกรูปแบนเนอร์ก่อน');if(S.banners.length>=10)return toast('ใส่แบนเนอร์ได้สูงสุด 10 อัน');let img;try{img=await shrink(f,1280,.78)}catch(er){return toast(er.message)}const lv=v('bl'),[lt,li]=lv.split(':');S.banners.push({id:uid(),img,title:v('bt').trim().slice(0,60),sub:v('bs').trim().slice(0,100),link:lv?{t:lt,id:li}:null,on:true});done('เพิ่มแบนเนอร์แล้ว')}
  else if(a==='sampleban'){S.banners.push({id:uid(),img:ban('#8b5cf6','#4f8cff'),title:'โปรโมชันพิเศษ',sub:'ซื้อแล้วรับสินค้าทันที',link:{t:'c',id:'c-game'},on:true},{id:uid(),img:ban('#ec4899','#8b5cf6'),title:'สินค้าใหม่มาแล้ว',sub:'ดูสินค้าทั้งหมดในร้าน',link:null,on:true});done('เพิ่มแบนเนอร์ตัวอย่างแล้ว')}
  else if(a==='banup'||a==='bandown'){const i=S.banners.findIndex(x=>x.id===id),j=a==='banup'?i-1:i+1;if(i>=0&&j>=0&&j<S.banners.length){[S.banners[i],S.banners[j]]=[S.banners[j],S.banners[i]];done()}}
  else if(a==='bantog'){const b=S.banners.find(x=>x.id===id);if(b){b.on=b.on===false;done()}}
  else if(a==='bandel'){S.banners=S.banners.filter(x=>x.id!==id);done()}
  else if(a==='preset'){if(hx.test(id)){S.settings.color=id;save();theme();const e=$('#sc');if(e)e.value=id}}
  else if(a==='rmlogo'){S.settings.logo='';done()}
  else if(a==='rmbgimg'){S.settings.bgImg='';done()}
  else if(a==='rmqr'){S.settings.qr='';done()}
  else if(a==='addlink'){const lb=v('lk').trim().slice(0,24),u=v('lu').trim();if(!lb)return toast('ใส่ชื่อปุ่ม');if(!/^https:\/\/[^\s"'<>]{3,300}$/.test(u))return toast('ลิงก์ต้องขึ้นต้นด้วย https://');if(S.settings.links.length>=8)return toast('เพิ่มได้สูงสุด 8 ช่องทาง');S.settings.links.push({id:uid(),label:lb,url:u});done('เพิ่มช่องทางแล้ว')}
  else if(a==='dellink'){S.settings.links=S.settings.links.filter(l=>l.id!==id);done()}
  else if(a==='saveset'){const c=v('sc'),c2=v('sc2');if(!hx.test(c)||!hx.test(c2))return toast('สีไม่ถูกต้อง');
    const lf=$('#slogo')&&$('#slogo').files[0],bf=$('#sbi')&&$('#sbi').files[0];let logo=S.settings.logo,bgImg=S.settings.bgImg;
    try{if(lf)logo=await shrink(lf,256,.9,'image/png');if(bf)bgImg=await shrink(bf,1280,.7)}catch(er){return toast(er.message)}
    const md=v('smode');S.settings={...S.settings,name:v('sn').trim().slice(0,40)||'ร้านทดลอง',tag:v('st').slice(0,100),color:c,color2:v('sc2m')==='c'?c2:'',mode:['dark','light'].includes(md)?md:'auto',logo,bgImg,dim:Math.max(40,Math.min(95,parseInt(v('sdim'),10)||78))};done('บันทึกแล้ว')}
  else if(a==='savecon'){const qf=$('#pq')&&$('#pq').files[0];let qr=S.settings.qr;try{if(qf)qr=await shrink(qf,600,.85)}catch(er){return toast(er.message)}
    S.settings={...S.settings,notice:v('nt').trim().slice(0,200),feat:[0,1,2].map(i=>({t:v('ft'+i).trim().slice(0,40),d:v('fd'+i).trim().slice(0,200)})),guide:v('gd').slice(0,2000),pay:v('py').slice(0,600),qr};done('บันทึกแล้ว')}
  else if(a==='wipe'){dlg('<h3>ล้างข้อมูลทั้งหมด?</h3><p class="mut">บัญชีลูกค้า ยอดเงิน คำสั่งซื้อ และ PIN แอดมินจะหายถาวร</p><button class="btn red" data-a="wipego">ล้างข้อมูล</button><button class="btn alt" data-a="close">ยกเลิก</button>')}
  else if(a==='wipego'){try{localStorage.removeItem(KEY);localStorage.removeItem(KEY2)}catch(er){}locked=false;S=seed();normalize();adminOk=false;closeDlg();view='home';catF='';me();save();admin();render()}
});
document.addEventListener('input',e=>{lastAct=Date.now();const t=e.target;if(t.classList&&t.classList.contains('slot'))cnt(t.closest('.sw'));if(t.id==='npcount')setSlots(parseInt(t.value,10)||0,true)});
document.addEventListener('change',e=>{if(e.target.id==='npt'){$('#npslots').hidden=e.target.value==='p'}});
setInterval(()=>{if(adminOk&&Date.now()-lastAct>300000){adminOk=false;admin();render();toast('ออกจากแผงแอดมินอัตโนมัติ (ไม่มีการใช้งาน 5 นาที)')}},15000);
try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(!locked)theme()})}catch(er){}
boot();
</script>
